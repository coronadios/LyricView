[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lyricview"
version = "0.1.0"
description = "A flexible open-source lyric viewer framework for web players, apps, and custom experiences."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Corona"}]
license = { text = "MIT" }
keywords = ["lyrics", "music", "viewer", "player", "theme", "cli"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Environment :: Console",
  "Topic :: Multimedia :: Sound/Audio",
]

[project.scripts]
lv = "lyricview.cli:main"

[tool.setuptools]
packages = ["lyricview"]
